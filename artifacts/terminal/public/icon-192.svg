<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090f1e"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="url(#primaryGrad)" stroke-width="6" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="200" stroke="#00d4ff" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="256" cy="256" r="140" stroke="#7c3aed" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="10 8"/>

  <path d="M 256 90 L 390 190 L 390 330 L 256 420 L 122 330 L 122 190 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-linejoin="round" filter="url(#glow)"/>

  <line x1="185" y1="260" x2="185" y2="340" stroke="#00d4ff" stroke-width="4" opacity="0.6"/>
  <rect x="175" y="280" width="20" height="40" rx="4" fill="#00d4ff" opacity="0.7"/>

  <line x1="256" y1="180" x2="256" y2="330" stroke="#7c3aed" stroke-width="4" opacity="0.8"/>
  <rect x="244" y="210" width="24" height="90" rx="5" fill="url(#primaryGrad)"/>

  <line x1="327" y1="140" x2="327" y2="300" stroke="#00ff88" stroke-width="4" filter="url(#glow)"/>
  <rect x="315" y="160" width="24" height="110" rx="5" fill="#00ff88" filter="url(#glow)"/>

  <path d="M 160 310 L 220 270 L 280 230 L 350 150" fill="none" stroke="#00ff88" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="350" cy="150" r="14" fill="#00ff88" filter="url(#glow)"/>
  <circle cx="280" cy="230" r="8" fill="#00d4ff"/>
  <circle cx="220" cy="270" r="8" fill="#7c3aed"/>
</svg>
